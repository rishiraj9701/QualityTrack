# Render Infrastructure Blueprint for QualityTrack
# Documentation: https://render.com/docs/blueprint-spec

services:
  # -------------------------------------------------------------
  # 1. QualityTrack Backend API (Node.js Web Service)
  # -------------------------------------------------------------
  - type: web
    name: qualitytrack-backend
    runtime: node
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: npm install && npm run build && npm run db:deploy && npm run seed
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: qualitytrack-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  # -------------------------------------------------------------
  # 2. QualityTrack Simulated Demo Target API (Node.js Web Service)
  # -------------------------------------------------------------
  - type: web
    name: qualitytrack-demo-api
    runtime: node
    rootDir: demo-api
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001

  # -------------------------------------------------------------
  # 3. QualityTrack Frontend (Static Site SPA)
  # -------------------------------------------------------------
  - type: web
    name: qualitytrack-frontend
    runtime: static
    rootDir: frontend
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: qualitytrack-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_DEMO_API_URL
        fromService:
          type: web
          name: qualitytrack-demo-api
          envVarKey: RENDER_EXTERNAL_URL

databases:
  # -------------------------------------------------------------
  # PostgreSQL Database for QualityTrack Core Backend
  # -------------------------------------------------------------
  - name: qualitytrack-db
    databaseName: qualitytrack
    user: qualitytrack_user
    plan: free
    region: oregon
